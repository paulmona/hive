# Allow sudo inside the hive-friday unit.
#
# hive-friday.service sets NoNewPrivileges=true. That flag is inherited by every
# child process and cannot be dropped once set, so it makes setuid binaries inert:
# sudo runs but never elevates, failing with "sudo: effective uid is not 0".
# /etc/sudoers.d/friday alone is not enough to get working sudo; this drop-in is
# the other half.
#
# This is a deliberate reduction in the unit's confinement. It is what makes the
# agent able to administer its own host (see systemd/README.md).

[Service]
NoNewPrivileges=no
