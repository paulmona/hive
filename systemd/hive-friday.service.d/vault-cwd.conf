# Start Friday inside her memory vault.
#
# obsidian-second-brain's SessionStart hook injects the vault's _CLAUDE.md only
# when the session's working directory is inside the vault; its bootstrap output
# says the same ("for sessions started inside the vault"). Running the product as
# designed means the agent's cwd is its vault folder, not its home directory.
#
# Repo work under ~/src still needs to be reachable: start-agent.sh passes
# --add-dir for it. That script is not managed by this repo (see tools/INSTALL.md).

[Service]
WorkingDirectory=/srv/hive-memory/friday
